  <circle cx="256" cy="256" r="256" fill="#6d28d9"/>
  <!-- Inner glow -->
  <circle cx="256" cy="256" r="220" fill="#8b5cf6" opacity="0.25"/>
  <!-- Compass/arrow pointing up — soft pink/fuchsia -->
